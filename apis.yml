aid: superb-ai
name: Superb AI
description: Superb AI (Superb AI Inc.) is a vision-intelligence company that turns industrial visual
  data into models enterprises can deploy. Its Superb Platform covers the data-centric computer-vision
  lifecycle end to end — dataset and image-asset management, human and automated annotation (Superb Label),
  dataset curation and embedding search (Superb Curate), model training, diagnosis and hosted inference
  endpoints (Superb Model), plus the ZERO vision foundation model for open-vocabulary detection. The platform
  is used by manufacturing, logistics, mobility and physical-security teams, and is delivered as cloud,
  private-cloud and air-gapped on-premise deployments. Developers reach it through a multi-tenant REST
  API, a first-party Python SDK family and the spb command-line interface.
