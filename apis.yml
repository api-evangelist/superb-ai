  name: Superb AI MLOps Platform API
  description: Multi-tenant REST backend for the Superb Platform. 164 operations across tenants, workspaces,
    image datasets and assets, projects and labeling workflow, annotations, comments, auto-label runs,
    model training, foundation models, deployments and exports. Bearer-token (Amazon Cognito) authentication
    with per-request workspace membership resolution, cursor pagination, an Idempotency-Key header on
    bulk operations, and a stable machine-readable error-code enum.
