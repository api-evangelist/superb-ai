domain_standard_summary: >-
  Superb AI's contract speaks the two formats that dominate its market. A buyer whose training
  pipeline already reads COCO or YOLO can consume a Superb AI export with no bespoke connector,
  which is the distinction this check exists to draw. The claim is made by the contract's own
  enums and schema constants, so it is verifiable without trusting a datasheet.
