note: 'Superb AI runs three surfaces and they do NOT overlap. (1) The MLOps Platform API (OpenAPI 3.1.0,
  164 operations) is the only one whose contract is public and readable. (2) The MCP server at docs.superb-ai.com/mcp
  is a ReadMe-platform DOCUMENTATION-SEARCH server over the docs corpus — it is not a projection of the
  REST API, so there is no operation for its tools to bind to, and its tool list is auth-gated and was
  not enumerated. (3) A GraphQL endpoint at api.superb-ai.com/graphql (and /curate/graphql) answers HTTP
  401 Unauthorized to an anonymous introspection POST — it is the legacy Suite/Curate backend and its
  schema is gated. Because neither non-REST surface could be read, crosswalk[] is EMPTY rather than guessed:
  binding tools by name alone across surfaces that serve different products would be fabrication. Every
  REST operation is therefore recorded as rest_only.'
