  /tenants/{slug}/datasets/images/{dataset_id}/assets:
    get:
      tags:
      - image_assets
      summary: List Assets
      operationId: image_assets-list_assets
      security:
      - HTTPBearer: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Dataset Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max rows per page.
          default: 50
          title: Limit
        description: Max rows per page.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response's `next_cursor`; omit for the first page.
          title: Cursor
        description: Opaque pagination cursor from a previous response's `next_cursor`; omit for the first page.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          description: Case-insensitive substring search (min 1 char). Wildcards are matched literally.
          title: Q
        description: Case-insensitive substring search (min 1 char). Wildcards are matched literally.
      - name: uploaded_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter to assets uploaded by this user.
          title: Uploaded By
        description: Filter to assets uploaded by this user.
      - name: created_at_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound (>=) on `created_at` (ISO-8601).
          title: Created At From
        description: Inclusive lower bound (>=) on `created_at` (ISO-8601).
      - name: created_at_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive upper bound (<) on `created_at` (ISO-8601).
          title: Created At To
        description: Exclusive upper bound (<) on `created_at` (ISO-8601).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AssetStatus'
          - type: 'null'
          description: Filter on asset processing `status` (e.g. 'ready'). Exact match.
          title: Status
        description: Filter on asset processing `status` (e.g. 'ready'). Exact match.
      - name: content_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter on MIME `content_type` (e.g. 'image/jpeg'). Exact match.
          title: Content Type
        description: Filter on MIME `content_type` (e.g. 'image/jpeg'). Exact match.
      - name: embedding_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EmbeddingStatus'
          - type: 'null'
          description: Filter on `embedding_status` ('pending' / 'ready'). Use `pending` to list assets the next /embed pass will pick up.
          title: Embedding Status
        description: Filter on `embedding_status` ('pending' / 'ready'). Use `pending` to list assets the next /embed pass will pick up.
      - name: include
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: CSV. `projects` → `[{id,name}]` per asset; `thumbnail_url` → presigned thumbnail URL per asset (saves the per-asset round trip in grid views).
          title: Include
        description: CSV. `projects` → `[{id,name}]` per asset; `thumbnail_url` → presigned thumbnail URL per asset (saves the per-asset round trip in grid views).
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: When true, response carries `total` = COUNT(*) for the same filter (ignores cursor/limit). ~150ms extra at the 1M-row dataset cap; opt in only when the FE needs a 'showing X of Y' header.
          default: false
          title: Include Total
        description: When true, response carries `total` = COUNT(*) for the same filter (ignores cursor/limit). ~150ms extra at the 1M-row dataset cap; opt in only when the FE needs a 'showing X of Y' header.
      responses:
        '200':
          description: Successful Response
          content:
