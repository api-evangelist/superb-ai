      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectAssetsBatchSetStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
