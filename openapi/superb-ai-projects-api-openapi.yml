      title: ProjectTagUpdateResponse
      description: 'Result of a tag update: the final palette entry + how many assets were

        rewritten (rename only; 0 for a pure recolor).'
    ProjectBulkRemoveAssetsRequest:
      properties:
        asset_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
