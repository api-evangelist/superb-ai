      - results
      title: ProjectAssetsBatchAddResponse
      description: 'Canonical sync batch-op envelope (ADR-0041): `total == added + skipped`,

        `len(results) == total`. `skipped` = already-in-scope (idempotent re-add).'
    VersionCreate:
      properties:
