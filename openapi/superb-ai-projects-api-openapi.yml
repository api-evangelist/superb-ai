        attributes:
          items:
            $ref: '#/components/schemas/AttributeCreate'
          type: array
          title: Attributes
      type: object
      required:
      - name
      - allowed_types
      title: ClassCreate
      description: 'Create an object class (`kind=''object''`) with optional inline attributes

        (fanned out to owned classification rows in one transaction).'
