  /tenants/{slug}/projects/{project_id}/duplicate:
    post:
      tags:
      - Projects
      summary: Duplicate Project
      description: 'Duplicate a project as a CONFIGURATION + data-selection clone (ADR-0122).


        Copies everything that defines *how the project is set up*: classes +

        attributes, members + roles, tag policy, auto-label config, guidelines

        (+ their S3 image attachments), and the asset **scope** (which images are in

        the project). It copies **no work** — annotations, labeling status,

        assignments, reviewers, and per-asset tags all reset — and **no history** —

        versions, models, deployments, exports, comments, activity are never copied.

        A clone is a fresh labeling pass on the same setup + images.


        Scope copy is set-based (`INSERT ... SELECT`). At/under

        `MAX_SYNC_DUPLICATE_SCOPE` it runs inline; above it, the clone + all config

        are created immediately and the (large) scope populates via an async job

        (kickoff/completion activity + progress), so the request never nears API GW''s

        29s cap. Either way the new project is returned at once, fully configured.'
      operationId: projects-duplicate_project
      security:
      - HTTPBearer: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDuplicateRequest'
