          format: uuid
          title: Id
        status:
          type: string
          enum:
          - approved
          - skipped
          title: Status
      type: object
      required:
      - id
      - status
      title: ProjectAssetsBatchApproveResultItem
    ProjectRole:
      type: string
      enum:
      - manager
      - reviewer
      - labeler
      title: ProjectRole
    AnnotationType:
      type: string
      enum:
      - bbox
      - polygon
      - keypoint
      - classification
      title: AnnotationType
    ProjectTagSummaryResponse:
      properties:
        total:
          type: integer
          title: Total
        tags:
          items:
            $ref: '#/components/schemas/ProjectTagSummaryItem'
          type: array
          title: Tags
      type: object
      required:
      - total
      - tags
      title: ProjectTagSummaryResponse
      description: 'Aggregate tag application across a target set. Powers the unified

        bulk-tag editor (one checkbox grid replacing the dual-arm add/remove

        pickers). Reuses the same `target` shape as `bulk-update-tags` so the

        dialog can pass the same payload it''s about to act on.


        Tags applied to **zero** assets in the target set are simply absent from

        the response. Color / display metadata is **not** denormalized here —

        the FE reads those from `project.tag_config.allowed_tags` by `value`.

        Free-form tag values (not in `allowed_tags`) show up with no color.'
    ProjectAssetsBatchSetStatusRequest:
      properties:
        asset_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Asset Ids
        target_status:
          $ref: '#/components/schemas/WorkflowStatus'
      type: object
      required:
      - asset_ids
      - target_status
      title: ProjectAssetsBatchSetStatusRequest
      description: Sync batch set-status. Explicit asset_ids only.
    KeypointGeometryRead:
      properties:
        type:
          type: string
          const: keypoint
          title: Type
          default: keypoint
        points:
          items:
            $ref: '#/components/schemas/KeypointNodeGeomRead'
          type: array
          title: Points
      additionalProperties: true
      type: object
      required:
      - points
      title: KeypointGeometryRead
    ProjectAssetsBatchApproveRequest:
      properties:
        asset_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Asset Ids
      type: object
      required:
      - asset_ids
      title: ProjectAssetsBatchApproveRequest
      description: Sync batch-approve. Explicit asset_ids only.
    ProjectBulkRejectAssetsRequest:
      properties:
        asset_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Asset Ids
        filter:
          anyOf:
          - $ref: '#/components/schemas/ProjectFilter'
          - type: 'null'
        exclude_asset_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Exclude Asset Ids
        reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Reason
      type: object
      title: ProjectBulkRejectAssetsRequest
      description: "Async bulk-reject. Optional `reason` flows into:\n- `project_asset_state.last_reject_reason`\n- a new Comment row (anchor=asset, origin=workflow_reject) so the\n  labeler sees the same reason they'd see for a single-asset reject."
    ClassResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          $ref: '#/components/schemas/ClassKind'
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
        allowed_types:
          items:
            type: string
          type: array
          title: Allowed Types
        archived:
          type: boolean
          title: Archived
        keypoint_topology:
          anyOf:
          - $ref: '#/components/schemas/KeypointTopology'
          - type: 'null'
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResponse'
          type: array
          title: Attributes
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - kind
      - name
      - color
      - allowed_types
      - archived
      - created_at
      - updated_at
      title: ClassResponse
      description: An object class with its owned attributes inline (ADR-0090 §3, Option A).
    ProjectAssetsBatchUpdateResultItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          enum:
          - updated
          - skipped
          title: Status
      type: object
      required:
      - id
      - status
      title: ProjectAssetsBatchUpdateResultItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
