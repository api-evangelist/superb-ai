        filter:
          anyOf:
          - $ref: '#/components/schemas/ProjectFilter'
          - type: 'null'
        exclude_asset_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Exclude Asset Ids
      type: object
      title: ProjectBulkRemoveAssetsRequest
      description: 'Async `bulk-remove` body. Selection is project-scoped — uses

        `ProjectFilter` since you''re choosing currently-in-project assets to

        drop (workflow + tag fields are meaningful). `exclude_asset_ids`

        (filter-mode only) deselects rows from the matched set — critical

