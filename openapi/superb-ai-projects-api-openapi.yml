  /tenants/{slug}/projects/{project_id}/versions/{version_id}/assets:
    get:
      tags:
      - Projects
      summary: List Version Assets
      description: 'List a version''s **frozen** assets — the durable snapshot, not live rows

        (ADR-0065 Phase 3). Backed by `version_asset_index`, so it survives asset

        deletion: an asset removed from the dataset since freeze still appears here,

        marked **`version_only`**, with a working presigned URL to its retained bytes

        (vs **`present`** — still in the live dataset). Cursor-paginated over the

        stable frozen scope order. **All filters operate on the frozen snapshot**, not

        live rows: `?q=` matches the frozen filename, `?tags=` the frozen tags (contains-ALL),

        `?classes=` the frozen annotations (ANY-of, ADR-0100), `?annotated=` whether the

        frozen asset carries any annotation — plus the negative twins `?tags_none=`,

        `?classes_none=`, `?tagged=` (ADR-0115; `status_not`/`assigned` don''t exist here —

        workflow state isn''t frozen). `total` is the count matching the filter. Each item carries frozen

        filename/dims/tags + thumbnail + full image URL — everything the grid/list

        needs without a live-row or manifest read.


        Read-only by nature; near-1:1 with the live asset list except editing and

        embedding/semantic search (a version_only asset has no embedding — the vector

        is CASCADE-dropped with the asset, and versions don''t freeze vectors).'
      operationId: projects-list_version_assets
      security:
      - HTTPBearer: []
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Version Id
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
