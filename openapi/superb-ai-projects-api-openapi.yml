    VersionAssetPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/VersionAssetView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        total:
