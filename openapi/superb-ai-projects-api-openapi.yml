          - type: 'null'
          title: Default
        required:
          type: boolean
          title: Required
          default: false
      type: object
      required:
      - input_type
      title: ClassificationConfig
      description: 'Per-label config for `type=classification` annotations. Stored on

        `ProjectClass.classification_config` as JSONB. ADR-0031.


        `options` is required for `radio` / `checkbox`, ignored for `text`.

        `default` (optional) names the pre-selected value (radio/text) or single

        pre-selected option (checkbox). `required: true` makes the workflow

        `submit` transition refuse if no annotation for this label exists on

        the asset.'
    AssetFilter:
      properties:
        created_at_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At From
        created_at_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At To
        uploaded_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Uploaded By
        q:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
        status:
          anyOf:
          - $ref: '#/components/schemas/AssetStatus'
          - type: 'null'
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
      additionalProperties: false
      type: object
      title: AssetFilter
    BboxGeometryRead:
      properties:
        type:
          type: string
          const: bbox
          title: Type
