          - type: 'null'
          title: Color
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        assets_renamed:
          type: integer
          title: Assets Renamed
          description: Asset rows whose tag array was rewritten (rename only).
      type: object
      required:
      - value
