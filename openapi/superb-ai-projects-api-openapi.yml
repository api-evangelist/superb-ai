      - EMBEDDER_UNAVAILABLE
      - EMBEDDER_INVOCATION_FAILED
      - NAME_TAKEN
      - IDEMPOTENCY_REPLAY
      - CONCURRENT_MODIFICATION
      - RATE_LIMITED
      - RESOURCE_LIMIT_EXCEEDED
      - INTERNAL_ERROR
      - DEPENDENCY_UNAVAILABLE
      - MODEL_LOADING
      - MODEL_STARTING
      description: Stable error code enum. Pattern-match here, never on `message`. Adding values is non-breaking; renaming/removing is a major bump.
    PolygonGeometryRead:
      properties:
        type:
          type: string
          const: polygon
          title: Type
          default: polygon
        polygons:
          items:
            $ref: '#/components/schemas/PolygonPartRead'
          type: array
          title: Polygons
      additionalProperties: true
      type: object
      required:
      - polygons
      title: PolygonGeometryRead
    AssignmentMode:
      type: string
      enum:
      - self_claim
      - manual
      title: AssignmentMode
    ProjectAssetsBatchRemoveResponse:
      properties:
        total:
          type: integer
          title: Total
        removed:
          type: integer
          title: Removed
        skipped:
          type: integer
          title: Skipped
        results:
          items:
            $ref: '#/components/schemas/ProjectAssetsBatchRemoveResultItem'
          type: array
          title: Results
      type: object
      required:
      - total
      - removed
      - skipped
      - results
      title: ProjectAssetsBatchRemoveResponse
      description: 'Canonical sync batch-op envelope (ADR-0041): `total == removed + skipped`,

        `len(results) == total`. `skipped` = not-in-project, nothing to drop.'
    ProjectAssetsBatchUpdateResponse:
      properties:
        total:
          type: integer
          title: Total
        updated:
          type: integer
          title: Updated
        skipped:
          type: integer
          title: Skipped
        results:
          items:
            $ref: '#/components/schemas/ProjectAssetsBatchUpdateResultItem'
          type: array
          title: Results
      type: object
      required:
      - total
      - updated
      - skipped
      - results
      title: ProjectAssetsBatchUpdateResponse
      description: 'Canonical sync batch-op envelope (ADR-0041): `total == updated + skipped`,

        `len(results) == total`. `skipped` = asset wasn''t in the project, was already

        in the desired tag state, or was otherwise filtered out by the WHERE clause.'
    ProjectAssetsBatchApproveResponse:
      properties:
        total:
          type: integer
          title: Total
