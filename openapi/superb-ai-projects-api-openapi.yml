      title: ProjectDuplicateRequest
    ProjectAssetsBatchAddResultItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          enum:
          - added
          - skipped
          title: Status
      type: object
      required:
      - id
      - status
      title: ProjectAssetsBatchAddResultItem
    ProjectAssetsBatchUnassignResultItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          enum:
          - unassigned
          - skipped
          title: Status
      type: object
      required:
      - id
      - status
      title: ProjectAssetsBatchUnassignResultItem
    ProjectAssetsBatchAddResponse:
      properties:
        total:
          type: integer
          title: Total
        added:
          type: integer
          title: Added
