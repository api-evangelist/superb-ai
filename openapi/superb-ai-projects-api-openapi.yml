        exclude_asset_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Exclude Asset Ids
        user_id:
          type: string
          format: uuid
          title: User Id
      type: object
      required:
      - user_id
      title: ProjectBulkAssignAssetsRequest
      description: 'Async bulk-assign. `user_id` must be a tenant member (project-member

        or tenant admin); route validates at job-create time so the job never

        enqueues with a bad assignee.'
