      - approved
      - skipped
      - results
      title: ProjectAssetsBatchApproveResponse
    FrozenShape:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        class_id:
          type: string
          format: uuid
          title: Class Id
        type:
          $ref: '#/components/schemas/AnnotationType'
        parent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Parent Id
        instance_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Instance Id
        geometry:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/BboxGeometryRead'
            - $ref: '#/components/schemas/PolygonGeometryRead'
            - $ref: '#/components/schemas/KeypointGeometryRead'
            discriminator:
              propertyName: type
              mapping:
                bbox: '#/components/schemas/BboxGeometryRead'
                keypoint: '#/components/schemas/KeypointGeometryRead'
                polygon: '#/components/schemas/PolygonGeometryRead'
          - type: 'null'
          title: Geometry
        data:
          additionalProperties: true
          type: object
          title: Data
        source:
          $ref: '#/components/schemas/AnnotationSource'
          default: manual
        created_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - class_id
      - type
      - created_at
      - updated_at
      title: FrozenShape
      description: 'One frozen annotation as serialized into an S3 version manifest by the

        freeze worker (`job_worker._serialize_ann`). Distinct from `AnnotationResponse`:

        the manifest omits `asset_id` (implied by the manifest file) and carries no

        `locked`. `geometry` is the constraint-free READ union (ADR-0104): it declares

        the shape for the SDK without re-imposing write-time value constraints on a

        frozen snapshot (`data` stays loose passthrough). Structurally safe: geometry

        keys only ever entered manifests via the strict write union post-0072.


        Lenient (`extra="ignore"`) so a future manifest field never breaks a versioned

        read or export of an older S3 blob. This is the shared shape typed by

        `ManifestShape` in `app/schemas/manifest.py` and re-exposed on the wire via

        `VersionAssetDetail.shapes`.'
    ClassCreate:
      properties:
        kind:
          type: string
          const: object
          title: Kind
          default: object
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Color
          default: '#888888'
        allowed_types:
          items:
            type: string
          type: array
          minItems: 1
          title: Allowed Types
        keypoint_topology:
          anyOf:
          - $ref: '#/components/schemas/KeypointTopology'
