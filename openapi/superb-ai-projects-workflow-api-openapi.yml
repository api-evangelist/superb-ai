  /tenants/{slug}/projects/{project_id}/assets/{asset_id}/reject:
    post:
      tags:
      - projects-workflow
      summary: Reject Asset
      description: Reviewer rejects work — auto-routes back to the original labeler.
      operationId: projects-workflow-reject_asset
      security:
      - HTTPBearer: []
      parameters:
      - name: asset_id
        in: path
